<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🐍 霓虹贪吃蛇 · Neon Snake</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="title">
        <h1>🐍 霓虹贪吃蛇</h1>
        <span class="subtitle">Neon Snake</span>
      </div>
      <div class="scoreboard">
        <div class="score-box">
          <span class="label">得分</span>
          <span id="score" class="value">0</span>
        </div>
        <div class="score-box">
          <span class="label">最高</span>
          <span id="best" class="value">0</span>
        </div>
      </div>
    </header>

    <div class="stage">
      <canvas id="board" width="440" height="440"></canvas>
      <div id="overlay" class="overlay">
        <div class="overlay-card">
          <div class="emoji">🐍</div>
          <h2 id="overlay-title">准备好了吗？</h2>
          <p id="overlay-text">选择一个难度，然后开始</p>
          <div class="diff-row">
            <button class="diff-btn" data-diff="easy">简单</button>
            <button class="diff-btn active" data-diff="normal">普通</button>
            <button class="diff-btn" data-diff="hard">困难</button>
          </div>
          <button id="start-btn" class="btn">开始游戏</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="pause-btn" class="btn ghost">暂停</button>
      <button id="restart-btn" class="btn ghost">重新开始</button>
      <button id="mute-btn" class="btn ghost" title="音效开关">🔊</button>
    </div>

    <p class="hint">电脑：方向键 / WASD 移动，空格暂停 · 手机：滑动屏幕控制方向</p>
  </main>

  <script src="game.js"></script>
</body>
</html>
